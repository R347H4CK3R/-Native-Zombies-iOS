name: iOS Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build simulator target
        run: |
          set -o pipefail
          xcodebuild -project NativeZombies.xcodeproj -scheme NativeZombies -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild -project NativeZombies.xcodeproj -scheme NativeZombies -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 16 Plus' CODE_SIGNING_ALLOWED=NO test
