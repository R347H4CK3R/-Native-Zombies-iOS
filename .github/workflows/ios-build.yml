name: iOS Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build simulator target
        run: |
          set -o pipefail
          xcodebuild -project NativeZombies.xcodeproj -scheme NativeZombies -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Validate tests
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available | sed -n 's/^[[:space:]]*\(iPhone[^()]*(.*)\) ([-A-F0-9]*).*$/\1/p' | head -1)
          if [ -n "$DEVICE" ]; then
            UDID=$(xcrun simctl list devices available | grep -m1 'iPhone' | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
            echo "Running tests on simulator $UDID"
            xcodebuild -project NativeZombies.xcodeproj -scheme NativeZombies -sdk iphonesimulator -destination "platform=iOS Simulator,id=$UDID" CODE_SIGNING_ALLOWED=NO test
          else
            echo "No iOS simulator runtime installed on runner; compiling test bundle instead."
            xcodebuild -project NativeZombies.xcodeproj -scheme NativeZombies -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build-for-testing
          fi
