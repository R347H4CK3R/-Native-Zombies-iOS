name: Publish reviewed Native Zombies prototype
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-reviewed-prototype.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-reviewed-native-zombies
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: R347H4CK3R/-Native-Zombies-iOS
      TAG: prototype-1.0-build1
      SOURCE_SHA: 1874b504502d00a2b120e15de1fd8e4a2cd374dd
      IPA_SHA: 249ea989a36898129a5edec08ba9d4c094b44b7e5ea0f469e44b7ef57f554c28
    steps:
      - name: Require successful exact source build
        run: |
          gh api "repos/$GH_REPO/actions/runs/36511217716" > run.json
          python3 - <<'PY'
          import json,os
          r=json.load(open('run.json'))
          assert r['conclusion']=='success' and r['head_sha']==os.environ['SOURCE_SHA']
          PY
      - uses: actions/download-artifact@v4
        with:
          repository: R347H4CK3R/-Native-Zombies-iOS
          run-id: 36511217716
          artifact-ids: '11008099931'
          github-token: ${{ github.token }}
          path: candidate
      - name: Verify unchanged reviewed IPA
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,plistlib,zipfile
          files=list(pathlib.Path('candidate').rglob('*.ipa'));assert len(files)==1
          p=files[0];assert p.stat().st_size==149560
          assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['IPA_SHA']
          with zipfile.ZipFile(p) as z:
            i=plistlib.loads(z.read('Payload/NativeZombies.app/Info.plist'))
            assert (i['CFBundleIdentifier'],str(i['CFBundleShortVersionString']),str(i['CFBundleVersion']))==('com.nativezombies.game','1.0','1')
          p.rename('NativeZombies-unsigned.ipa')
          pathlib.Path('SHA256SUMS').write_text(os.environ['IPA_SHA']+'  NativeZombies-unsigned.ipa\n')
          PY
      - name: Publish exact prototype without replacing existing release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite it.'
            exit 1
          fi
          cat > release-notes.md <<'NOTES'
          Original Native Zombies prototype, version 1.0 (1), for iOS 17 or later.

          A small native Metal survival-game prototype with procedural visuals, rounds, weapons, touch/controller input and developer controls. This is an experimental development build, not an Activision game or a finished commercial title.

          This unchanged unsigned IPA comes from source commit 1874b504502d00a2b120e15de1fd8e4a2cd374dd and successful build https://github.com/R347H4CK3R/-Native-Zombies-iOS/actions/runs/36511217716 . That run passed 20 simulator unit tests and an ARM64 device build. Separate archive checks verified the app identity, version, device platform and minimum OS. Physical-device gameplay and SideStore installation have not been tested.

          Sign with a compatible sideloading tool before installation. Keep save backups; do not confuse this app with Afterlight, which has a different bundle identifier. No proprietary game assets are included by this project's build.

          SHA-256: 249ea989a36898129a5edec08ba9d4c094b44b7e5ea0f469e44b7ef57f554c28
          NOTES
          gh release create "$TAG" --target "$SOURCE_SHA" --title 'Native Zombies 1.0 (1) - experimental prototype' --notes-file release-notes.md --draft NativeZombies-unsigned.ipa SHA256SUMS
          gh release view "$TAG" --json assets > release.json
          python3 - <<'PY'
          import json
          a=[x for x in json.load(open('release.json'))['assets'] if x['name']=='NativeZombies-unsigned.ipa']
          assert len(a)==1 and a[0]['size']==149560
          PY
          gh release edit "$TAG" --draft=false --latest=false
