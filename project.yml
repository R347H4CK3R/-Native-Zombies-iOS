name: NativeZombies
options:
  bundleIdPrefix: com.nativezombies
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  NativeZombies:
    type: application
    platform: iOS
    sources:
      - src
    resources:
      - assets/placeholder
    info:
      path: Config/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nativezombies.game
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEV_MOD_MENU
    scheme:
      testTargets:
        - NativeZombiesTests
  NativeZombiesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - tests
    dependencies:
      - target: NativeZombies
